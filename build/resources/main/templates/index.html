<script th:inline="javascript">
    /*<![CDATA[*/
    // 데이터 가져오기 및 변환
    const dataList = /*[[${result}]]*/ [];
    
    // 데이터가 있는지 확인
    if (dataList && dataList.length > 0) {
        console.log("가져온 데이터:", dataList);
        
        // 날짜 기준으로 정렬
        dataList.sort((a, b) => {
            if (a.date < b.date) return -1;
            if (a.date > b.date) return 1;
            return 0;
        });
        
        // 데이터 추출
        const data = dataList.map(item => {
            // 문자열인 경우 명시적으로 숫자로 변환
            return parseInt(item.count || 0);
        });
        
        const labels = dataList.map(item => item.date);
        
        // 차트 초기화
        document.addEventListener('DOMContentLoaded', function() {
            initChart(labels, data, 0); // maxValue는 차트 함수 내에서 계산
        });
    } else {
        console.warn("가져온 데이터가 없습니다.");
        // 데이터가 없는 경우 빈 차트 표시
        document.addEventListener('DOMContentLoaded', function() {
            initChart(["데이터 없음"], [0], 5);
        });
    }
    /*]]>*/
</script>
